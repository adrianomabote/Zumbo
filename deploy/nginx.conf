# Configuração Nginx — Megabyte
# VPS com múltiplos projectos: HTTP na porta 80/3003 e HTTPS na porta 443.
#
# Activar:
#   cp deploy/nginx.conf /etc/nginx/sites-available/megabyte
#   ln -sf /etc/nginx/sites-available/megabyte /etc/nginx/sites-enabled/megabyte
#   nginx -t && systemctl reload nginx

server {
    # HTTP — redireccionar sempre para HTTPS, incluindo a porta 3003
    listen 80;
    listen 3003;
    server_name megabyte.live www.megabyte.live;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    server_name megabyte.live www.megabyte.live;

    # Certificado Let's Encrypt para o domínio público
    ssl_certificate /etc/letsencrypt/live/megabyte.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/megabyte.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ─── Ficheiros estáticos do site ───────────────────────────────────────
    root /opt/net-servicos/artifacts/net-servicos/dist/public;
    index index.html;

    # ─── API (proxy para o servidor Node.js interno na porta 3004) ─────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O navegador deve poder verificar actualizações do PWA sem receber um
    # service worker ou manifest antigo do cache de assets de longa duração.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ─── Cache de ficheiros estáticos ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Segurança básica ──────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Logs
    access_log /var/log/nginx/net-servicos-access.log;
    error_log /var/log/nginx/net-servicos-error.log;
}
