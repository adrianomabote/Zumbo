# Configuração Nginx — Megabyte
# VPS com múltiplos projectos: HTTP na porta 80/3003 e HTTPS na porta 443.
#
# Activar:
#   cp deploy/nginx.conf /etc/nginx/sites-available/net-servicos
#   ln -sf /etc/nginx/sites-available/net-servicos /etc/nginx/sites-enabled/net-servicos
#   nginx -t && systemctl reload nginx

server {
    # HTTP — manter também a porta 3003 para compatibilidade
    listen 80;
    listen 3003;
    listen 443 ssl;

    server_name net-servicos.online www.net-servicos.online;

    # Certificado Let's Encrypt para o domínio público
    ssl_certificate /etc/letsencrypt/live/net-servicos.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/net-servicos.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ─── Ficheiros estáticos do site ───────────────────────────────────────
    root /opt/net-servicos/artifacts/net-servicos/dist/public;
    index index.html;

    # ─── API (proxy para o servidor Node.js interno na porta 3001) ─────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache de ficheiros estáticos ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Segurança básica ──────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Logs
    access_log /var/log/nginx/net-servicos-access.log;
    error_log /var/log/nginx/net-servicos-error.log;
}
