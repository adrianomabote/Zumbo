# Configuração Nginx — Net Serviços
# VPS com múltiplos projectos: escuta na porta 7000 (mude para 10000 se precisar).
#
# Activar:
#   cp deploy/nginx.conf /etc/nginx/sites-available/net-servicos
#   ln -sf /etc/nginx/sites-available/net-servicos /etc/nginx/sites-enabled/net-servicos
#   nginx -t && systemctl reload nginx

server {
    # Porta pública — porta 80 quando tiver domínio
    listen 80;
    listen 3003;

    # Coloque o seu domínio aqui quando tiver (ex: netservicos.co.mz)
    server_name net-servicos.online www.net-servicos.online;

    # ─── Ficheiros estáticos do site ───────────────────────────────────────
    root /opt/net-servicos/artifacts/net-servicos/dist/public;
    index index.html;

    # ─── API (proxy para o servidor Node.js interno na porta 3001) ─────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache de ficheiros estáticos ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Segurança básica ──────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Logs
    access_log /var/log/nginx/net-servicos-access.log;
    error_log /var/log/nginx/net-servicos-error.log;
}
