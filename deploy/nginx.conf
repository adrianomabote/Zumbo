# Configuração Nginx — Net Serviços
# Substituir SEU_DOMINIO pelo domínio real (ex: netservicos.co.mz) ou pelo IP da VPS.
#
# Activar:
#   cp deploy/nginx.conf /etc/nginx/sites-available/net-servicos
#   ln -sf /etc/nginx/sites-available/net-servicos /etc/nginx/sites-enabled/net-servicos
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name SEU_DOMINIO;

    # ─── Site Net Serviços (ficheiros estáticos) ───────────────────────────
    root /opt/net-servicos/artifacts/net-servicos/dist/public;
    index index.html;

    # ─── API e sistema de pagamentos ───────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # Streaming de eventos (SSE/webhooks)
        proxy_buffering off;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Segurança básica ──────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Cache de ficheiros estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/net-servicos-access.log;
    error_log /var/log/nginx/net-servicos-error.log;
}
